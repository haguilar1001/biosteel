name: Sync Flujo diario

# Corre todos los días a las 08:00 UTC = 3:00 a. m. Colombia (UTC-5).
# También se puede ejecutar a mano desde la pestaña Actions (Run workflow).
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar flujo desde OneDrive
        run: |
          echo "Llamando al endpoint de sincronización de flujo…"
          curl -fsS "https://biosteel.up.railway.app/api/flujo/sync?secret=${{ secrets.CRON_SECRET }}"
          echo ""
          echo "Listo."
